name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  desktop-selftest:
    name: Autoprueba de escritorio + pruebas M1/M2 (sin ventana)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar SDL2 (version y SHA-256 fijados)
        run: ./scripts/fetch_sdl.sh

      - name: "Compilar CMake (motor + assetcheck + dumpslp + gendata)"
        run: |
          cmake -S . -B build-desktop -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DSDL_AUDIO=OFF -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF -DSDL_POWER=OFF \
            -DSDL_SENSOR=OFF -DSDL_TIMERS=ON -DSDL_TESTS=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_OPENGL=OFF -DSDL_VULKAN=OFF
          cmake --build build-desktop --parallel

      - name: "Autoprueba del motor (driver dummy)"
        run: |
          SDL_VIDEODRIVER=dummy ./build-desktop/aoe --selftest --frames 120 \
            --screenshot build-desktop/selftest.bmp --logdir build-desktop
          test -s build-desktop/selftest.bmp
          test -s build-desktop/game.log
          ! grep -q FATAL build-desktop/game.log

      - name: Pruebas M1 (datos sinteticos, lectores DRS/SLP/paleta/dat, corruptos)
        run: ./scripts/m1_tests.sh build-desktop

      - name: Pruebas M2 (mapa isometrico, tile del dat, camara, anti-pantalla-negra)
        run: ./scripts/m2_tests.sh build-desktop

      - name: "Demo M1 en pantalla con captura"
        run: |
          rm -rf /home/runner/.local/share/aoe-mobile/m1
          SDL_VIDEODRIVER=dummy ./build-desktop/aoe --selftest --m1-demo --frames 120 \
            --screenshot build-desktop/selftest_m1.bmp --logdir build-desktop
          test -s build-desktop/selftest_m1.bmp
          test -s build-desktop/selftest_m1.png || true
          ! grep -q FATAL build-desktop/game.log

      - name: Subir evidencia
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-M0-M2
          path: |
            build-desktop/selftest.bmp
            build-desktop/selftest_m1.bmp
            build-desktop/game.log
            build-desktop/m1/marco0.png
            build-desktop/m1/marco1.png
            build-desktop/m1/marco2.png
            build-desktop/m1/marco0_p5.png
            build-desktop/m1/MANIFIESTO.txt
            build-desktop/m1_assetcheck_ok.txt
            build-desktop/m1_gendata.txt
            build-desktop/m2_mapa.bmp
            build-desktop/m2_mapa.bmp.png
            build-desktop/m2run1/game.log
            build-desktop/m2_gendata.txt
          if-no-files-found: error

  android-apk:
    name: APK Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar SDL2 (version y SHA-256 fijados)
        run: ./scripts/fetch_sdl.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK de depuracion
        run: gradle -p android-project assembleDebug --no-daemon --stacktrace

      - name: Preparar artefacto
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk aoe-mobile-M2-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aoe-mobile-M2-debug-apk
          path: aoe-mobile-M2-debug.apk
          if-no-files-found: error
