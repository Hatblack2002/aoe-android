plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aoemobile.engine'
    compileSdk 34

    // NDK preinstalado en los runners de GitHub (evita la auto-instalacion
    // flaky del SDK manager durante el configure de AGP).
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "com.aoemobile.engine"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "0.3.0-m2"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"
                // Spec §3: arquitectura objetivo arm64-v8a.
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            // El CMake raíz (mismo código que la autoprueba de escritorio).
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
